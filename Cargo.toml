[workspace]
members = [
  "src/dmsg_types",
  "src/dmsg_protocol",
  "src/dmsg_client",
  "src/dmsg_agent",
  "src/dmsg_cli",
  "src/dmsg_runtime",
  "src/dmsg_handle",
  "src/dmsg_user",
  "src/dmsg_cose",
  "src/dmsg_directory",
  "src/dmsg_payment",
  "src/membership",
  "src/dmsg_commerce",
  "src/dmsg_wallet",
  "src/dmsg_wallet_hub",
  "tests/dmsg_integration",
  "tests/dmsg_test_support",
  "tests/dmsg_test_ledger",
  "tests/dmsg_test_sns",
  "tests/dmsg_test_cmc",
  "examples/dmsg-account-product",
  "tests/dmsg_test_legacy",
  "src/cli_airdrop",
  "src/cli_dmsg",
  "src/ic_delegation_store",
  "src/ic_dmsg_minter",
  "src/ic_message",
  "src/ic_message_channel",
  "src/ic_message_profile",
  "src/ic_message_types",
  "src/ic_name_identity",
  "src/ic_panda_luckypool",
  "src/ic_signin_with",
  "src/lib_dummy_getrandom",
  "src/lib_panda",
]
resolver = "2"

[profile.release]
debug = false
lto = true
strip = true
opt-level = 's'

[profile.release.package.ic_name_identity]
codegen-units = 1

[profile.release.package.ic_delegation_store]
codegen-units = 1

[profile.release.package.ic_signin_with]
codegen-units = 1

[workspace.package]
edition = "2024"
version = "3.1.3"
repository = "https://github.com/ldclabs/ic-panda"
keywords = ["canister", "icp", "panda"]
categories = ["web-programming"]
license = "Apache-2.0"

[workspace.dependencies]
aes-gcm = "0.11"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
agent-protocols = { version = "0.12.6", default-features = false }
axum = { version = "0.8", default-features = false }
bytes = "1"
base64 = "0.23"
bs58 = "0.5"
candid = "0.10"
cbor2 = { version = "1", features = ["derive"] }
dav-server = { version = "0.11", default-features = false }
cose2 = "0.5"
futures = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false }
log = "0.4"
serde = "1"
serde_bytes = "0.11"
serde_json = { version = "1", features = ["preserve_order"] }
serde_jcs = "0.2"
structured-logger = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", default-features = false }
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false }
ed25519-dalek = "3"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
hpke = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false }
infer = "0.22"
http = "1"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
ripemd = { version = "0.2", default-features = false }
k256 = { version = "0.14" }
p256 = { version = "0.14", default-features = false }
zeroize = "1"
num-bigint = "0.5"
num-traits = "0.2"
mime = "0.3"
ic-agent = "0.49"
ic-cdk = "0.20"
ic-cdk-management-canister = "0.3"
ic-cdk-timers = "1.0"
ic-stable-structures = "0.7"
icrc-ledger-types = "0.2"
ic_auth_types = "0.10"
ic_auth_verifier = { version = "0.10" }
ic_bls12_381 = "0.10"
ic_cose_types = "0.11"
ic_cose_chain_key = { version = "0.11" }
ic-certification = "4"
ic-oss-types = "1.3"
ic-canister-sig-creation = "1.3"
ic-ed25519 = "0.6"
ic-secp256k1 = "0.3"
ic-http-certification = "4"
ic-vetkeys = { version = "0.9" }
ic-verify-bls-signature = "0.6"
lazy_static = "1.5"
once_cell = "1.21"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive"] }
ic-dummy-getrandom-for-wasm = "0.1"
getrandom = "0.4"
# Pinned as in anda-bot: credential-store initialization has regressed in
# patch releases, so upgrades are validated explicitly.
keyring = "=4.2.0"
rqrr = { version = "0.11", default-features = false }
rusqlite = "0.40"
toml = "1"
url = "2.5"
urlencoding = "2.1"
zip = { version = "9", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }

[workspace.metadata.cargo-shear]
ignored = ["ic-dummy-getrandom-for-wasm", "lib_dummy_getrandom"]
