[workspace]
members = [
  "src/dmsg_types",
  "src/dmsg_protocol",
  "src/dmsg_client",
  "src/dmsg_mobile",
  "src/dmsg_agent",
  "src/dmsg_cli",
  "src/dmsg_runtime",
  "src/dmsg_handle",
  "src/dmsg_user",
  "src/dmsg_cose",
  "src/dmsg_directory",
  "src/dmsg_payment",
  "src/membership",
  "src/dmsg_commerce",
  "src/dmsg_wallet",
  "src/dmsg_wallet_hub",
  "tests/dmsg_integration",
  "tests/dmsg_test_support",
  "tests/dmsg_test_ledger",
  "tests/dmsg_test_sns",
  "tests/dmsg_test_cmc",
  "examples/dmsg-account-product",
  "tests/dmsg_test_legacy",
  "src/ic_delegation_store",
  "src/ic_dmsg_minter",
  "src/ic_message",
  "src/ic_message_channel",
  "src/ic_message_profile",
  "src/ic_message_types",
  "src/ic_name_identity",
  "src/ic_panda_luckypool",
  "src/ic_signin_with",
  "src/lib_dummy_getrandom",
  "src/lib_panda",
]
resolver = "2"

# Keep the daemon's test unwind tables below Mach-O's 16 MiB compact-unwind limit.
[profile.test.package.dmsg_cli]
opt-level = 1

[profile.release]
debug = false
lto = true
strip = true
opt-level = 's'

[profile.release.package.ic_name_identity]
codegen-units = 1

[profile.release.package.ic_delegation_store]
codegen-units = 1

[profile.release.package.ic_signin_with]
codegen-units = 1

[workspace.package]
edition = "2024"
version = "3.1.5"
repository = "https://github.com/ldclabs/ic-panda"
keywords = ["canister", "icp", "panda"]
categories = ["web-programming"]
license = "Apache-2.0"

[workspace.dependencies]
# Local dependencies with version requirements for publication.
dmsg_types = { path = "src/dmsg_types", version = "0.4" }
ic_message_types = { path = "src/ic_message_types", version = "3" }
lib_panda = { path = "src/lib_panda", version = "0.2" }

aes-gcm = "0.11"
alloy-consensus = "2"
alloy-eips = "2"
alloy-primitives = "1"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
agent-protocols = { version = "0.12.6", default-features = false }
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
bytes = "1"
base64 = "0.23"
bitcoin = "0.32"
bs58 = "0.5"
candid = "0.10"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
cbor2 = { version = "1", features = ["derive"] }
core-foundation = "0.10"
dav-server = { version = "0.11", default-features = false }
cose2 = "0.5"
finl_unicode = "1.3"
flate2 = "1"
fuse3 = { version = "0.9.0", default-features = false }
futures = { version = "0.3", default-features = false }
futures-timer = "3"
futures-util = { version = "0.3", default-features = false }
log = "0.4"
serde = "1"
serde_bytes = "0.11"
serde_json = { version = "1", features = ["preserve_order"] }
serde_jcs = "0.2"
structured-logger = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", default-features = false }
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false }
ed25519-dalek = "3"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
hpke = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false }
infer = "0.22"
http = "1"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
signature = "2"
solana-address = "2"
solana-hash = "4"
solana-instruction = "4"
solana-message = "5"
ssh-key = { version = "0.6.7", default-features = false }
ripemd = { version = "0.2", default-features = false }
k256 = { version = "0.14" }
p256 = { version = "0.14", default-features = false }
zeroize = "1"
num-bigint = "0.5"
num-traits = "0.2"
mime = "0.3"
ic-agent = "0.49"
ic-cdk = "0.20"
ic-cdk-management-canister = "0.3"
ic-cdk-timers = "1.0"
ic-stable-structures = "0.7"
icrc-ledger-types = "0.2"
ic_auth_types = "0.10"
ic_auth_verifier = { version = "0.10" }
ic_bls12_381 = "0.10"
ic_cose_types = "0.11"
ic_cose_chain_key = { version = "0.11" }
ic-certification = "4"
# ic_auth_verifier 0.10 and ic-agent 0.49 certificates use version 3.
ic-certification-v3 = { package = "ic-certification", version = "3" }
ic-oss-types = "1.3"
ic-canister-sig-creation = "1.3"
ic-ed25519 = "0.6"
ic-secp256k1 = "0.3"
ic-http-certification = "4"
ic-response-verification = "4"
# The integration suite pins this release for the workspace.
ic-vetkeys = "=0.9.0"
# ic-vetkeys names its key IDs with this release of the management types.
vetkd_key_id = { package = "ic-cdk-management-canister", version = "0.1.1" }
ic-verify-bls-signature = "0.6"
lazy_static = "1.5"
libc = "0.2"
once_cell = "1.21"
pocket-ic = "=16"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive"] }
ic-dummy-getrandom-for-wasm = "0.1"
getrandom = "0.4"
# Pinned as in anda-bot: credential-store initialization has regressed in
# patch releases, so upgrades are validated explicitly.
keyring = "=4.2.0"
qrcode = { version = "0.14", default-features = false }
rpassword = "7"
rqrr = { version = "0.11", default-features = false }
rusqlite = "0.40"
scopeguard = "1.2"
thiserror = "2"
toml = "1"
# Preserve the client's existing parser version.
toml09 = { package = "toml", version = "0.9" }
tungstenite = { version = "0.29", default-features = false }
uniffi = "=0.32.2"
url = "2.5"
urlencoding = "2.1"
zip = { version = "9", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }

[workspace.metadata.cargo-shear]
ignored = ["ic-dummy-getrandom-for-wasm", "lib_dummy_getrandom"]
