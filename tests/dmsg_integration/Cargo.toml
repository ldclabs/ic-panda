[package]
name = "dmsg_integration"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
pocketic-tests = []

[[test]]
name = "control_plane"
required-features = ["pocketic-tests"]

[[test]]
name = "directory"
required-features = ["pocketic-tests"]

[[test]]
name = "legacy_fixture"
required-features = ["pocketic-tests"]

[[test]]
name = "legacy_dependencies"
required-features = ["pocketic-tests"]

[[test]]
name = "desktop"
required-features = ["pocketic-tests"]

[[test]]
name = "signin_with"
required-features = ["pocketic-tests"]

[dev-dependencies]
tokio.workspace = true
ic_cose_types.workspace = true
ic-oss-types.workspace = true
ic_message_types = { path = "../../src/ic_message_types" }
dmsg_protocol = { path = "../../src/dmsg_protocol", features = ["cose-pins"] }
dmsg_runtime = { path = "../../src/dmsg_runtime" }
dmsg_types = { path = "../../src/dmsg_types" }
pocket-ic.workspace = true
candid.workspace = true
cbor2.workspace = true
serde.workspace = true
serde_bytes.workspace = true
ed25519-dalek.workspace = true
# The sign-in test checks the delegations ic_signin_with certifies.
bs58.workspace = true
ic_auth_types.workspace = true
ic_auth_verifier = { workspace = true, features = ["envelope"] }
flate2.workspace = true
hmac.workspace = true
sha2.workspace = true
ic-certification.workspace = true
ic-stable-structures.workspace = true
icrc-ledger-types.workspace = true
ic-vetkeys.workspace = true
k256 = { workspace = true, features = ["ecdsa"] }
# The wallet tests check signed transactions with independent libraries.
alloy-consensus = { workspace = true, features = ["k256"] }
alloy-eips.workspace = true
dmsg_client = { path = "../../src/dmsg_client" }
bitcoin.workspace = true
ic-ed25519.workspace = true
ic-secp256k1.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }

serde_json.workspace = true
agent-protocols.workspace = true
base64.workspace = true
hex.workspace = true
ic-agent.workspace = true
# The desktop test plays the login page over loopback HTTP.
reqwest = { workspace = true, features = ["blocking"] }
# The desktop test fronts the local Agent Discourse host with HTTPS.
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
# The desktop test reads the daemon's /ws/app/v1 events.
tungstenite = { workspace = true, features = ["handshake"] }
# The gateway-side verifier pairs with the workspace HTTP certification types.
ic-http-certification.workspace = true
ic-response-verification.workspace = true
dmsg_account_product = { path = "../../examples/dmsg-account-product" }
