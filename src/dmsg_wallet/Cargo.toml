[package]
name = "dmsg_wallet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bs58.workspace = true
candid.workspace = true
cbor2.workspace = true
dmsg_protocol = { path = "../dmsg_protocol" }
dmsg_runtime = { path = "../dmsg_runtime" }
dmsg_types = { path = "../dmsg_types" }
ed25519-dalek.workspace = true
ic-cdk.workspace = true
ic-cdk-management-canister.workspace = true
ic-cdk-timers.workspace = true
ic-stable-structures.workspace = true
icrc-ledger-types.workspace = true
k256 = { workspace = true, features = ["ecdsa", "schnorr"] }
lib_dummy_getrandom = { path = "../lib_dummy_getrandom" }
serde = { workspace = true, features = ["derive"] }
serde_bytes.workspace = true
sha2.workspace = true
sha3.workspace = true

[dev-dependencies]
alloy-consensus = { workspace = true, features = ["k256"] }
alloy-eips.workspace = true
alloy-primitives.workspace = true
bitcoin.workspace = true
hex.workspace = true
ic-ed25519.workspace = true
ic-secp256k1.workspace = true
serde_json.workspace = true
solana-address = { workspace = true, features = ["curve25519", "sha2"] }
solana-hash.workspace = true
solana-instruction.workspace = true
solana-message = { workspace = true, features = ["wincode"] }
