[package]
name = "dmsg_cli"
version = "1.1.4"
edition.workspace = true
license.workspace = true
description = "dmsg: the dMsg command line client and daemon"
repository.workspace = true
publish = false

[[bin]]
name = "dmsg"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["http1", "json", "tokio", "ws"] }
base64.workspace = true
bytes.workspace = true
candid.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
chrono.workspace = true
clap.workspace = true
dav-server.workspace = true
dmsg_agent = { path = "../dmsg_agent" }
dmsg_client = { path = "../dmsg_client" }
dmsg_types = { path = "../dmsg_types" }
futures-util = { workspace = true, features = ["sink", "std"] }
hex.workspace = true
keyring.workspace = true
log.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
rpassword.workspace = true
# The hint channel's TLS uses the same provider as reqwest.
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true }
tokio-tungstenite = { workspace = true, features = [
  "connect",
  "handshake",
  "rustls-tls-webpki-roots",
] }
toml.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fuse3 = { workspace = true, features = ["tokio-runtime", "unprivileged"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS mount goes through NetFS, whose API takes Core Foundation values.
core-foundation.workspace = true


# `build.rs` reads the Swift toolchain's library paths on macOS.
[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
dmsg_client = { path = "../dmsg_client", features = ["testing"] }
p256 = { workspace = true, features = ["ecdsa"] }
