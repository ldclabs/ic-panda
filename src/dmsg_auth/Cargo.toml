[dependencies]
dmsg_protocol = { path = "../dmsg_protocol" }
dmsg_runtime = { path = "../dmsg_runtime" }
dmsg_types = { path = "../dmsg_types" }
candid.workspace = true
cbor2.workspace = true
serde = { workspace = true, features = ["derive"] }
