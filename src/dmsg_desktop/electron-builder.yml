# The base configuration: ad-hoc signed, no update feed, as the release
# workflow packages macOS without a Developer ID. Local packages use
# electron-builder.local.cjs, which signs with the keychain's Developer ID and
# adds the feed when it can; releases use electron-builder.release.cjs, which
# adds signing, notarization and the feed.
afterPack: scripts/fskit-after-pack.cjs
afterSign: scripts/fskit-after-sign.cjs
appId: net.dmsg.desktop
productName: dMsg
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - resources/tray*.png
  - package.json
asar: true
electronDist: node_modules/electron/dist
extraResources:
  # The release's own dmsg (scripts/prepare-runtime.mjs). The app only runs
  # it as `dmsg install`, which puts it at the shared CLI location; the app
  # then runs the installed one.
  - from: resources/runtime
    to: runtime
mac:
  identity: '-'
  # The bundled dmsg keeps the signature of the release binary, byte for byte.
  signIgnore:
    - /Contents/Resources/runtime/dmsg$
    - /Contents/Extensions/SecretsFS.appex(/|$)
  category: public.app-category.productivity
  target: [dmg, zip]
  hardenedRuntime: true
  entitlements: resources/entitlements.local.plist
  entitlementsInherit: resources/entitlements.local.plist
  # The daemon's device transfers listen on and browse the local network,
  # which macOS asks the person about once.
  extendInfo:
    NSLocalNetworkUsageDescription: dMsg finds your other devices on the local network to move your files between them directly.
    NSBonjourServices:
      - _dmsg-xfer._tcp
win:
  target: [nsis]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
protocols:
  - name: dMsg
    schemes: [dmsg]
# Stable names let the install page and Homebrew link to the latest release.
artifactName: dMsg-${os}-${arch}.${ext}
