<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      ;(() => {
        const supported = ['en', 'zh', 'ru', 'ar', 'fr', 'es']
        const match = (value) =>
          typeof value === 'string' &&
          supported.find(
            (code) => code === value.trim().toLowerCase().split(/[-_]/)[0]
          )
        let stored
        try {
          stored = localStorage.getItem('dmsg:locale')
        } catch {}
        const locale =
          match(stored) ||
          (navigator.languages?.length
            ? navigator.languages
            : [navigator.language]
          )
            .map(match)
            .find(Boolean) ||
          'en'
        document.documentElement.lang = locale
        document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr'
      })()
    </script>

    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    />

    <title>dMsg — Your space. Your say.</title>
    <meta
      name="description"
      content="An encrypted workspace on your computer. The desktop app, the dmsg command line and your AI agents work through it, and nothing is signed until you approve."
    />
    <link href="https://dmsg.net" rel="canonical" />
    <meta content="dMsg — Your space. Your say." property="og:title" />
    <meta
      content="An encrypted workspace on your computer. The desktop app, the dmsg command line and your AI agents work through it, and nothing is signed until you approve."
      property="og:description"
    />
    <meta content="website" property="og:type" />
    <meta content="https://dmsg.net" property="og:url" />
    <meta
      content="https://dmsg.net/_assets/dmsg/og-image.png"
      property="og:image"
    />
    <meta content="1200" property="og:image:width" />
    <meta content="630" property="og:image:height" />
    <meta content="image/png" property="og:image:type" />
    <meta
      content="dMsg — Your space. Your say. Desktop, command line and AI agents; nothing is signed until you approve. Desktop app and CLI in development."
      property="og:image:alt"
    />
    <meta content="summary_large_image" name="twitter:card" />
    <meta
      content="https://dmsg.net/_assets/dmsg/og-image.png"
      name="twitter:image"
    />
    <meta
      content="dMsg — Your space. Your say. Desktop, command line and AI agents; nothing is signed until you approve. Desktop app and CLI in development."
      name="twitter:image:alt"
    />
    <meta content="@ICPandaDAO" name="twitter:creator" />

    <!-- The Gate mark: an adaptive SVG, an ICO tile for the rest. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/_assets/dmsg/icon.svg" />
    <link rel="apple-touch-icon" href="/_assets/dmsg/apple-touch-icon.png" />
    <meta name="msapplication-TileColor" content="#145C45" />
    <meta name="theme-color" content="#F7F8F4" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-status-bar-style" content="#5bbad5" />
    <meta name="mobile-web-app-title" content="dMsg.net" />

    %sveltekit.head%
    <!-- LINKS_PRELOADER -->
  </head>

  <body data-theme="icpanda">
    <div style="display: contents"> %sveltekit.body% </div>
  </body>
</html>
