<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://icp-api.io" crossorigin="anonymous" />
    <script>
      ;(() => {
        const supported = ['en', 'zh', 'zh-Hant', 'ru', 'ar', 'fr', 'es', 'hi', 'id', 'pt-BR', 'ja', 'de', 'ko', 'it', 'tr', 'vi', 'th', 'fil', 'ms', 'bn', 'ur', 'pl', 'nl']
        const match = (value) => {
          if (typeof value !== 'string') return null
          const [primary, ...subtags] = value.trim().toLowerCase().replaceAll('_', '-').split('-')
          if (primary === 'zh') {
            if (subtags.includes('hans')) return 'zh'
            if (subtags.includes('hant')) return 'zh-Hant'
            return subtags.some((part) => ['tw', 'hk', 'mo'].includes(part)) ? 'zh-Hant' : 'zh'
          }
          if (primary === 'pt') return 'pt-BR'
          if (primary === 'in') return 'id'
          if (primary === 'tl') return 'fil'
          return supported.includes(primary) ? primary : null
        }
        let stored
        try {
          stored = localStorage.getItem('dmsg:locale')
        } catch {}
        const locale =
          match(stored) ||
          (navigator.languages?.length
            ? navigator.languages
            : [navigator.language]
          )
            .map(match)
            .find(Boolean) ||
          'en'
        document.documentElement.lang = locale
        document.documentElement.dir = (locale === 'ar' || locale === 'ur') ? 'rtl' : 'ltr'
      })()
    </script>

    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    />

    <title>dMsg — Private collaboration for people and agents</title>
