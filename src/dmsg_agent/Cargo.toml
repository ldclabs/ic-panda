[package]
name = "dmsg_agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "dMsg as an Agent Protocols local connector host: Agent ID connectors and the MCP tool catalog"
repository.workspace = true
readme = "README.md"
publish = false

[dependencies]
agent-protocols = { workspace = true, features = ["local-connector"] }
dmsg_types = { path = "../dmsg_types" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true }
url.workspace = true

[dev-dependencies]
base64.workspace = true
