[package]
name = "dmsg_protocol"
version = "0.4.5"
edition.workspace = true
license.workspace = true
description = "Deterministic encoding, COSE document verification, and approval helpers for dMsg"
repository.workspace = true
readme = "README.md"
keywords = ["dmsg", "icp", "cose", "signing", "protocol"]
categories = ["cryptography", "encoding"]
publish = true

[dependencies]
agent-protocols.workspace = true
base64.workspace = true
hmac.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
ic_auth_verifier = { workspace = true, features = ["envelope"] }
ic-certification-v3.workspace = true
dmsg_types.workspace = true
candid.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_bytes.workspace = true
cbor2.workspace = true
cose2 = { workspace = true, features = ["crypto-ed25519-dalek"] }
sha2.workspace = true
sha3.workspace = true
ripemd.workspace = true
bs58.workspace = true
k256 = { workspace = true, features = ["ecdsa", "schnorr"] }
p256 = { workspace = true, features = ["ecdsa"] }
ed25519-dalek.workspace = true
ic_bls12_381.workspace = true
icrc-ledger-types.workspace = true
url.workspace = true
mime.workspace = true
chrono.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
ic-vetkeys = { workspace = true, optional = true }
vetkd_key_id = { workspace = true, optional = true }

[features]
# Offline COSE master-key pins for deployment tooling.
cose-pins = ["dep:ic-vetkeys", "dep:vetkd_key_id"]

[dev-dependencies]
ic-secp256k1.workspace = true
ic-verify-bls-signature.workspace = true
ic-canister-sig-creation.workspace = true
hex.workspace = true

[[example]]
name = "cose_pins"
required-features = ["cose-pins"]

[[bench]]
name = "validation"
harness = false
