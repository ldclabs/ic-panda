[package]
name = "dmsg_protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Deterministic encoding, COSE document verification, and approval helpers for dMsg"
repository.workspace = true
readme = "README.md"
keywords = ["dmsg", "icp", "cose", "signing", "protocol"]
categories = ["cryptography", "encoding"]
publish = true

[dependencies]
dmsg_types = { path = "../dmsg_types", version = "0.1.0" }
candid.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_bytes.workspace = true
cbor2.workspace = true
cose2 = { workspace = true, features = ["crypto-ed25519-dalek"] }
sha2.workspace = true
ed25519-dalek.workspace = true
ic_bls12_381.workspace = true
icrc-ledger-types.workspace = true
url.workspace = true
mime.workspace = true
k256 = { workspace = true, features = ["ecdsa"] }

[dev-dependencies]
hex.workspace = true

[[bench]]
name = "validation"
harness = false
