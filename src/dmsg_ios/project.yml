name: dMsg
options:
  bundleIdPrefix: net.dmsg
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, fr, es, ru, ar]
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # LDC Labs Limited. Must match the app ID in dmsg.net's
    # apple-app-site-association, or the login callback never returns.
    DEVELOPMENT_TEAM: S9Z2WAMAV8
    CODE_SIGN_STYLE: Automatic
packages:
  DMsgCore:
    path: CoreBridge
targets:
  dMsg:
    type: application
    platform: iOS
    sources: [App, Features, Platform, Resources]
    dependencies:
      - package: DMsgCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.dmsg.ios
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/dMsg.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  dMsgTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: dMsg
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  dMsgUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: dMsg
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  dMsg:
    build:
      targets:
        dMsg: all
    test:
      targets: [dMsgTests, dMsgUITests]
