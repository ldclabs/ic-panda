[package]
name = "dmsg_client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "dMsg client core shared by the desktop daemon and the mobile apps"
repository.workspace = true
readme = "README.md"
publish = false

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
agent-protocols = { workspace = true, features = ["http-client"] }
base64.workspace = true
candid = { workspace = true, features = ["value"] }
cbor2.workspace = true
dmsg_protocol = { path = "../dmsg_protocol" }
dmsg_types = { path = "../dmsg_types" }
ed25519-dalek.workspace = true
getrandom = { workspace = true, features = ["sys_rng"] }
hex.workspace = true
hkdf.workspace = true
hmac.workspace = true
# ic_auth_verifier 0.10 and ic-agent 0.49 certificates use ic-certification 3.
ic-certification = "3"
ic_auth_verifier.workspace = true
hpke = { workspace = true, features = ["alloc", "aes", "x25519"] }
ic-ed25519.workspace = true
ic-secp256k1.workspace = true
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }
infer.workspace = true
ic-agent.workspace = true
icrc-ledger-types.workspace = true
ic-vetkeys.workspace = true
p256 = { workspace = true, features = ["ecdsa", "std"] }
reqwest = { workspace = true, features = ["rustls", "json"] }
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_bytes.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha3.workspace = true
url.workspace = true
zeroize.workspace = true

[features]
# Offline unlocked clients for the tests of crates built on this one.
testing = []

[dev-dependencies]
tokio = { workspace = true }
