name: dMsg release
# The dMsg client: the dmsg CLI and daemon for macOS, Linux and Windows, and
# the desktop app for macOS and Windows. Tags are X.Y.Z or X.Y.Z-beta.N.
# GitHub Latest stays on the LDC bridge for legacy updaters. New clients enumerate
# complete releases; every stable release still updates Homebrew. Beta is opt-in.
#
# Signing credentials in the dmsg-release environment:
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD   Developer ID Application .p12 (base64) and password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   notarization
#   MAC_FSKIT_PROFILE_BASE64  Yiwen Developer ID profile for net.dmsg.desktop.SecretFiles
#   CERTUM_USERNAME, CERTUM_OTP_URI      SimplySign login for Windows code signing
#   HOMEBREW_TAP_TOKEN                   write access to ldclabs/homebrew-tap
on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      make_latest: ${{ steps.version.outputs.make_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify release source and CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/verify-release-source.sh
      # One version for the tag, the dmsg binary and the desktop app.
      - id: version
        run: node scripts/dmsg/release-config.cjs

  binary:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: dmsg-macos-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: dmsg-linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: dmsg-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: dmsg-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Keep in step with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        shell: bash
        run: |
          cargo build --release --locked -p dmsg_cli --target ${{ matrix.target }}
          mkdir release
          exe=dmsg; [ "$RUNNER_OS" = Windows ] && exe=dmsg.exe
          cp "target/${{ matrix.target }}/release/$exe" "release/${{ matrix.asset }}"
          "release/${{ matrix.asset }}" --version
      - name: Checksum
        if: runner.os != 'Windows'
        shell: bash
        working-directory: release
        run: |
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          $sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ runner.os == 'Windows' && 'unsigned-windows-cli' || format('release-{0}', matrix.asset) }}
          path: release/*
          if-no-files-found: error

  # Its own job, so only it and the desktop jobs see the signing secrets.
  sign-macos:
    needs: binary
    # SecretsFS uses the macOS 27 FSKit handlers.
    runs-on: xcode-27
    environment: dmsg-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare the FSKit toolchain
        run: |
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          test "${sdk%%.*}" -ge 27
          command -v xcodegen || brew install xcodegen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dmsg-macos-arm64
          path: release
      - name: Sign the CLI and build the distribution FSKit module
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_FSKIT_PROFILE_BASE64: ${{ secrets.MAC_FSKIT_PROFILE_BASE64 }}
        run: |
          # Artifacts do not keep the executable bit.
          chmod +x release/dmsg-macos-arm64
          scripts/dmsg/sign-macos.sh release/dmsg-macos-arm64 "$RUNNER_TEMP/SecretsFS.zip"
          release/dmsg-macos-arm64 --version
          (cd release && shasum -a 256 dmsg-macos-arm64 > dmsg-macos-arm64.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dmsg-macos-arm64
          path: release/*
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-secretsfs
          path: ${{ runner.temp }}/SecretsFS.zip
          if-no-files-found: error

  desktop:
    needs: [version, binary, sign-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: dmsg-macos-arm64
          - os: windows-latest
            asset: dmsg-windows-x64.exe
    runs-on: ${{ matrix.os }}
    environment: dmsg-release
    env:
      # The package bundles this release's own dmsg, byte for byte.
      DMSG_DESKTOP_RUNTIME: ${{ github.workspace }}/runtime/${{ matrix.asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The pnpm version pinned by packageManager in the root package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @dmsg/desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ runner.os == 'Windows' && 'unsigned-windows-cli' || format('release-{0}', matrix.asset) }}
          path: runtime
      - if: runner.os == 'macOS'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-secretsfs
          path: ${{ runner.temp }}/dmsg-fskit
      - name: Stage the signed FSKit extension
        if: runner.os == 'macOS'
        run: |
          ditto -x -k "$RUNNER_TEMP/dmsg-fskit/SecretsFS.zip" "$RUNNER_TEMP/dmsg-fskit"
          echo "DMSG_FSKIT_EXTENSION=$RUNNER_TEMP/dmsg-fskit/SecretsFS.appex" >> "$GITHUB_ENV"
      - name: Prepare
        shell: bash
        run: |
          chmod +x "$DMSG_DESKTOP_RUNTIME"
          pnpm --dir src/dmsg_desktop build
          node src/dmsg_desktop/scripts/prepare-runtime.mjs
      - name: Read the pinned Certum publisher
        id: certum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pem = Get-Content scripts/dmsg/certum-signer.pem -Raw
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::CreateFromPem($pem)
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          "publisher=$($cert.Subject)" >> $env:GITHUB_OUTPUT
      - name: Connect SimplySign
        if: runner.os == 'Windows'
        uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64 # v1.2.5
        with:
          certum-username: ${{ secrets.CERTUM_USERNAME }}
          certum-otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certum-key-id: ${{ steps.certum.outputs.thumbprint }}
      - name: Package
        shell: bash
        working-directory: src/dmsg_desktop
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          DMSG_WINDOWS_PUBLISHER: ${{ steps.certum.outputs.publisher }}
          DMSG_WINDOWS_CERT_SHA1: ${{ steps.certum.outputs.thumbprint }}
        run: pnpm exec electron-builder --config electron-builder.release.cjs --publish never
      - name: Verify Authenticode and collect the signed Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/dmsg/collect-signed-release.ps1
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-signed-cli
          path: signed-cli/*
          if-no-files-found: error
      - name: Verify the notarized macOS update and its embedded FSKit extension
        if: runner.os == 'macOS'
        run: |
          ditto -x -k src/dmsg_desktop/release/dMsg-mac-arm64.zip "$RUNNER_TEMP/dmsg-update"
          node src/dmsg_desktop/scripts/fskit-package.cjs verify-app "$RUNNER_TEMP/dmsg-update/dMsg.app"
          xcrun stapler validate "$RUNNER_TEMP/dmsg-update/dMsg.app"
      - name: Collect
        shell: bash
        run: |
          mkdir desktop-release
          cp src/dmsg_desktop/release/dMsg-* desktop-release/
          for feed in latest-mac.yml latest.yml beta-mac.yml beta.yml; do
            [ -f "src/dmsg_desktop/release/$feed" ] && cp "src/dmsg_desktop/release/$feed" desktop-release/
          done
          cd desktop-release
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          for file in dMsg-*.dmg dMsg-*.zip dMsg-*.exe; do
            [ -f "$file" ] && $sum "$file" > "$file.sha256"
          done
          node ../src/dmsg_desktop/scripts/verify-release.cjs .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-desktop-${{ matrix.os }}
          path: desktop-release/*
          if-no-files-found: error

  release:
    permissions:
      contents: write
    needs: [version, binary, sign-macos, desktop]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: dmsg-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Verify binary and package checksums
        working-directory: release
        run: sha256sum --check ./*.sha256
      - name: Require the legacy update bridge before a later stable release
        if: needs.version.outputs.prerelease == 'false' && needs.version.outputs.make_latest == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          node -e 'require("./scripts/dmsg/release-config.cjs").assertLegacyLatest(process.argv[1])' "$latest"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        id: upload
        with:
          name: dMsg ${{ needs.version.outputs.version }}
          files: release/*
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: false
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.upload.outputs.id }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          MAKE_LATEST: ${{ needs.version.outputs.make_latest }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease="$PRERELEASE" -f make_latest="$MAKE_LATEST"
      - name: Homebrew
        if: needs.version.outputs.prerelease == 'false'
        env:
          CHECKSUM_DIR: release
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then echo "No HOMEBREW_TAP_TOKEN; the tap is not updated."; exit 0; fi
          scripts/dmsg/publish-homebrew.sh "$GITHUB_REF_NAME"
