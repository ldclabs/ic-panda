name: Test
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  web:
    runs-on: ubuntu-latest
    env:
      # Only the local smoke test runs Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      # Use the pnpm version pinned by packageManager in the root package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # dmsg-sdk exports its built dist, which workspace packages resolve.
      - run: pnpm --dir packages/dmsg-sdk build
      - run: node --test scripts/cose-prune.test.mjs
      # The legacy library and the operator tools for the legacy name import.
      - run: pnpm --dir src/dmsg_legacy check
      - run: pnpm --dir src/dmsg_legacy test
      - run: pnpm --dir src/dmsg_legacy test:scripts
      # dmsg.net, including the dmsg-login/1 page checked against tests/vectors/client/login-v1.json.
      - run: pnpm --dir src/dmsg_frontend test
      # The dmsg-connect/1 bridge page, checked against tests/vectors/client/connect-v1.json;
      # its real-browser tests run with the desktop end-to-end tests.
      - run: pnpm --dir src/dmsg_connect check
      - run: pnpm --dir src/dmsg_connect test
      - run: pnpm --dir src/dmsg_connect build
        env:
          DMSG_CONNECT_CONFIG: tests/build.config.json
      # The desktop shell; its Electron smoke test needs a display and runs locally.
      - run: pnpm --dir src/dmsg_desktop check
      - run: pnpm --dir src/dmsg_desktop test
      - run: pnpm --dir src/dmsg_desktop build
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep in step with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      # make test-dmsg runs the SDK tests against the PocketIC proof with node --test.
      - name: Install dMsg SDK dependencies
        run: pnpm install --frozen-lockfile --filter dmsg-sdk
      # The desktop client crates are rustfmt-clean; their vector tests run with the workspace.
      # The two-device daemon test (tests/dmsg_integration/tests/desktop.rs) needs the private relay.
      - name: Check client formatting
        run: cargo fmt --check -p dmsg_client -p dmsg_agent -p dmsg_cli
      - name: Run clippy
        run: cargo clippy --verbose --all-targets --all-features
      - name: Run tests
        run: cargo test --verbose --workspace -- --nocapture
      - name: Install Candid extractor
        run: cargo install candid-extractor --version 0.1.6 --locked
      - name: Test dMsg Wasm and protocol contracts
        run: make test-dmsg
