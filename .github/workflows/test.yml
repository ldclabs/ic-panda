name: Test
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      # Only the local smoke test runs Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Use the pnpm version pinned by packageManager in the root package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # dmsg-sdk exports its built dist, which workspace packages resolve.
      - run: pnpm --dir packages/dmsg-sdk build
      - run: node --test scripts/cose-prune.test.mjs
      # The legacy library and the operator tools for the legacy name import.
      - run: pnpm --dir src/dmsg_legacy check
      - run: pnpm --dir src/dmsg_legacy test
      - run: pnpm --dir src/dmsg_legacy test:scripts
      # dmsg.net, including the dmsg-login/1 page checked against tests/vectors/client/login-v1.json.
      # It imports the generated (untracked) Candid bindings in src/declarations.
      - run: node scripts/generate-declarations.mjs
      - run: pnpm --dir src/dmsg_frontend check
      - run: pnpm --dir src/dmsg_frontend test
      # Check the shipped no-JavaScript pages, Markdown snapshots and discovery files.
      - run: pnpm --dir src/dmsg_frontend build
      # The dmsg-connect/1 bridge page, checked against tests/vectors/client/connect-v1.json;
      # its real-browser tests run with the desktop end-to-end tests.
      - run: pnpm --dir src/dmsg_connect check
      - run: pnpm --dir src/dmsg_connect test
      - run: pnpm --dir src/dmsg_connect build
        env:
          DMSG_CONNECT_CONFIG: tests/build.config.json
      # The desktop shell; its Electron smoke test needs a display and runs locally.
      - run: pnpm --dir src/dmsg_desktop check
      - run: pnpm --dir src/dmsg_desktop test
      - run: pnpm --dir src/dmsg_desktop build
  windows-release-verifier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify an Authenticode executable and reject modified bytes
        shell: pwsh
        run: |
          $exe = (Get-Command node.exe).Source
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          $pem = Join-Path $env:RUNNER_TEMP signer.pem
          $signature.SignerCertificate.ExportCertificatePem() | Set-Content $pem -Encoding ascii
          ./scripts/dmsg/install.ps1 -VerifyFile $exe -SignerPem $pem
          $copy = Join-Path $env:RUNNER_TEMP changed.exe
          $bytes = [IO.File]::ReadAllBytes($exe)
          $bytes[2] = $bytes[2] -bxor 1
          [IO.File]::WriteAllBytes($copy, $bytes)
          try { ./scripts/dmsg/install.ps1 -VerifyFile $copy -SignerPem $pem }
          catch { Write-Host "Modified executable rejected"; exit 0 }
          throw 'Accepted a modified executable'
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Keep in step with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      # Only main saves the cache; pull requests restore it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The desktop client crates are rustfmt-clean; their vector tests run with the workspace.
      # The two-device daemon test (tests/dmsg_integration/tests/desktop.rs) needs the private relay.
      - name: Check adopted Agent Protocols fixtures
        run: python3 scripts/sync-agent-protocols.py --check
      - name: Check client formatting
        run: cargo fmt --check -p dmsg_client -p dmsg_agent -p dmsg_cli
      - name: Run clippy
        run: cargo clippy --verbose --all-targets --all-features
      - name: Run tests
        run: cargo test --verbose --workspace -- --nocapture
  # The PocketIC suites take most of the run, so each runner takes a third of them.
  dmsg:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      DMSG_POCKETIC_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Keep in step with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: clippy
      # The shards build the same targets; one saves the cache, candid-extractor included.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
      # make test-dmsg runs the SDK tests against the PocketIC proof with node --test.
      - name: Install dMsg SDK dependencies
        run: pnpm install --frozen-lockfile --filter dmsg-sdk
      - name: Install Candid extractor
        run: cargo install candid-extractor --version 0.1.6 --locked
      - name: Test dMsg Wasm and protocol contracts
        run: make test-dmsg
