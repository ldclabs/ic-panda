name: Canisters release
on:
  push:
    tags:
      - "canisters-v*"
permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify release source and CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/verify-release-source.sh
  test:
    needs: verify-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Keep in step with rust-toolchain.toml; the Wasm hashes depend on it.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build canisters
        run: |
          cargo install ic-wasm --version 0.11.1 --locked
          BINARYEN_VERSION="version_131"
          BINARYEN_ARCHIVE="binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz"
          BINARYEN_DIR="$(mktemp -d)"
          curl --fail --location --retry 3 \
            --output "$BINARYEN_DIR/$BINARYEN_ARCHIVE" \
            "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/$BINARYEN_ARCHIVE"
          echo "b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db  $BINARYEN_DIR/$BINARYEN_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$BINARYEN_DIR/$BINARYEN_ARCHIVE" -C "$BINARYEN_DIR"
          WASM_OPT="$BINARYEN_DIR/binaryen-$BINARYEN_VERSION/bin/wasm-opt"
          ic-wasm --version
          "$WASM_OPT" --version
          mkdir out
          cargo build --target wasm32-unknown-unknown --release --locked -p dmsg_auth -p dmsg_user -p dmsg_handle -p dmsg_cose -p dmsg_directory -p dmsg_payment -p membership -p dmsg_commerce -p dmsg_wallet -p dmsg_wallet_hub -p ic_delegation_store -p ic_signin_with
          for CAN in dmsg_auth dmsg_user dmsg_handle dmsg_cose dmsg_directory dmsg_payment membership dmsg_commerce dmsg_wallet dmsg_wallet_hub ic_delegation_store ic_signin_with
          do
            cp "target/wasm32-unknown-unknown/release/$CAN.wasm" out/
            cp "src/$CAN/$CAN.did" "out/$CAN.did"
            WASM="out/$CAN.wasm"
            ic-wasm "$WASM" -o "$WASM" metadata candid:service -f "out/$CAN.did" -v public
            ic-wasm "$WASM" -o "$WASM" shrink
            "$WASM_OPT" \
              -O3 \
              --enable-mutable-globals \
              --enable-nontrapping-float-to-int \
              --enable-simd \
              --enable-bulk-memory \
              --enable-sign-ext \
              --enable-reference-types \
              --enable-memory64 \
              --enable-multivalue \
              --enable-tail-call \
              --inline-functions-with-loops \
              "$WASM" -o "$WASM.optimized"
            mv "$WASM.optimized" "$WASM"
            gzip -n "$WASM"
            SHA256="$(sha256sum < "out/$CAN.wasm.gz" | sed 's/ .*$//g')"
            echo "$SHA256" > "out/$CAN.wasm.gz.$SHA256.txt"
          done
          ls -lah out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canister-release
          path: out/*
          if-no-files-found: error

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: canisters-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: canister-release
          path: out
      - name: Prepare complete release
        id: upload
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: out/*
          fail_on_unmatched_files: true
          draft: true
          # Keep the dMsg client update bridge as Latest.
          make_latest: false
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.upload.outputs.id }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=false
