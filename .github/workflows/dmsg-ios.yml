name: dMsg iOS
on:
  workflow_dispatch:
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Require the reviewed SDK
        run: |
          test "$(uname -m)" = arm64
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          fi
          xcodebuild -version
          xcodebuild -version | head -1 | grep -Fx 'Xcode 27.1'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - name: Select an available iPhone simulator
        run: |
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for values in devices.values() for d in values if d["name"].startswith("iPhone")))')
          echo "DMSG_TEST_SIMULATOR=$simulator" >> "$GITHUB_ENV"
      - run: bash scripts/ios/verify.sh "$DMSG_TEST_SIMULATOR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmsg-ios-test-results
          path: |
            src/dmsg_ios/.build/*.xcresult
            src/dmsg_ios/CoreBridge/Artifacts/build.sha256
